<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Clarity — Student Loan Borrower Sentiment Index™</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07111f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
    .spinner { width: 48px; height: 48px; border: 3px solid #1e3a5f; border-top-color: #2d7dd2; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dashboard { max-width: 1440px; margin: 0 auto; padding-bottom: 32px; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid #0f2240; background: #07111f; position: sticky; top: 0; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg,#1a6eb5,#2d7dd2); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-name { font-size: 20px; font-weight: 700; }
    .logo-sub  { font-size: 13px; color: #8ab0d8; margin-left: 4px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .live-badge { display: flex; align-items: center; gap: 6px; background: #0f2240; border: 1px solid #1e3a5f; padding: 5px 13px; border-radius: 20px; font-size: 12px; color: #8ab0d8; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .hbtn { width: 34px; height: 34px; border-radius: 8px; background: #0f2240; border: 1px solid #1e3a5f; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
    .hbtn:hover { background: #1e3a5f; }

    .kpi-bar { display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid #0f2240; }
    .kpi-item { padding: 13px 24px; border-right: 1px solid #0f2240; }
    .kpi-item:last-child { border-right: none; }
    .kpi-label { font-size: 10px; color: #6888a8; text-transform: uppercase; letter-spacing: .06em; }
    .kpi-value { font-size: 16px; font-weight: 700; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .c-green  { color: #22c55e; } .c-orange { color: #f97316; } .c-red { color: #ef4444; } .c-blue { color: #3b82f6; } .c-yellow { color: #eab308; }

    .main-grid { display: grid; grid-template-columns: 370px 1fr 330px; border-bottom: 1px solid #0f2240; }

    .gauge-panel { padding: 22px 18px 18px; border-right: 1px solid #0f2240; display: flex; flex-direction: column; gap: 14px; }
    .panel-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #6888a8; text-transform: uppercase; }
    .gauge-status { font-size: 18px; font-weight: 800; letter-spacing: .06em; }
    .gauge-updated { font-size: 11px; color: #4a6888; margin-top: 3px; }
    .emotion-grid { display: flex; flex-direction: column; gap: 7px; }
    .emotion-row { display: flex; align-items: center; gap: 9px; }
    .e-label { font-size: 11px; color: #8ab0d8; width: 86px; flex-shrink: 0; }
    .e-track { flex:1; height: 5px; background: #0f2240; border-radius: 3px; overflow: hidden; }
    .e-fill  { height: 100%; border-radius: 3px; transition: width 1s ease; }
    .e-pct   { font-size: 11px; color: #4a6888; width: 28px; text-align: right; }

    .center-panel { padding: 22px 26px; border-right: 1px solid #0f2240; display: flex; flex-direction: column; gap: 18px; }
    .ct-title { font-size: 15px; font-weight: 700; color: #c8ddf0; }
    .ct-sub   { font-size: 11px; color: #4a6888; margin-top: 2px; }
    .ai-box { background: #0b1d35; border: 1px solid #1e3a5f; border-radius: 10px; padding: 13px 15px; }
    .ai-lbl  { font-size: 10px; color: #2d7dd2; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
    .ai-text { font-size: 13px; color: #c0d8f0; margin-top: 5px; line-height: 1.5; }
    .post-row { display: flex; align-items: flex-start; gap: 8px; background: #0b1d35; border: 1px solid #1e3a5f; border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; }
    .post-sub  { font-size: 10px; color: #2d7dd2; white-space: nowrap; flex-shrink: 0; }
    .post-title{ font-size: 11px; color: #a0c0e0; line-height: 1.4; }

    .right-panel { padding: 22px 18px; display: flex; flex-direction: column; gap: 22px; }
    .section-hdr { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #6888a8; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #0f2240; }
    .pulse-list { display: flex; flex-direction: column; gap: 9px; margin-top: 10px; }
    .pulse-item { display: flex; align-items: flex-start; gap: 9px; background: #0b1d35; border: 1px solid #1e3a5f; border-radius: 9px; padding: 11px 13px; }
    .pulse-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
    .pulse-title  { font-size: 12px; font-weight: 600; color: #e0f0ff; line-height: 1.3; }
    .pulse-detail { font-size: 10px; color: #5a7898; margin-top: 2px; line-height: 1.4; }
    .topic-row { background: #0b1d35; border: 1px solid #1e3a5f; border-radius: 7px; padding: 8px 11px; font-size: 11px; color: #a0c0e0; display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .topic-num { font-size: 10px; color: #2d7dd2; }

    .bottom-section { padding: 22px 28px; }
    .bottom-title { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #6888a8; text-transform: uppercase; margin-bottom: 14px; padding-bottom: 9px; border-bottom: 1px solid #0f2240; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
    .metric-card  { background: #0b1d35; border: 1px solid #1e3a5f; border-radius: 11px; padding: 16px 18px; display: flex; align-items: flex-start; gap: 12px; }
    .metric-icon  { width: 38px; height: 38px; border-radius: 9px; background: #07111f; border: 1px solid #1e3a5f; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .metric-label { font-size: 11px; color: #6888a8; line-height: 1.3; }
    .metric-value { font-size: 20px; font-weight: 800; margin-top: 3px; }

    .signals-section { padding: 0 28px 28px; }
    .signals-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; }
    .sig-card  { background: #0b1d35; border: 1px solid #1e3a5f; border-radius: 9px; padding: 12px 14px; text-align: center; }
    .sig-name  { font-size: 9px; color: #6888a8; text-transform: uppercase; letter-spacing: .06em; }
    .sig-score { font-size: 26px; font-weight: 800; margin: 5px 0 2px; }
    .sig-weight{ font-size: 10px; color: #2d7dd2; font-weight: 600; }
    .sig-note  { font-size: 9px; color: #4a6888; margin-top: 3px; }

    @media(max-width:1100px){ .main-grid{grid-template-columns:1fr} .kpi-bar{grid-template-columns:repeat(2,1fr)} .metrics-grid{grid-template-columns:repeat(2,1fr)} .signals-grid{grid-template-columns:repeat(3,1fr)} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

function SvgChart({ data, color, fill, height, mini }) {
  if (!data || data.length < 2) return null;
  const W = 560, H = height || 180;
  const pad = { t: 10, r: 10, b: mini ? 22 : 30, l: mini ? 28 : 34 };
  const minV = 0, maxV = 100;
  const scaleX = i => pad.l + (i / (data.length - 1)) * (W - pad.l - pad.r);
  const scaleY = v => pad.t + ((maxV - v) / (maxV - minV)) * (H - pad.t - pad.b);
  const pts = data.map((d, i) => [scaleX(i), scaleY(d.score)]);
  const linePts = pts.map(p => p.join(',')).join(' ');
  const areaD = `M${pts[0][0]},${pts[0][1]} ` +
    pts.slice(1).map(p => `L${p[0]},${p[1]}`).join(' ') +
    ` L${pts[pts.length-1][0]},${H-pad.b} L${pts[0][0]},${H-pad.b} Z`;
  const id = `g${color.replace('#','')}`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.02"/>
        </linearGradient>
      </defs>
      {[0,25,50,75,100].map(v=>(
        <line key={v} x1={pad.l} y1={scaleY(v)} x2={W-pad.r} y2={scaleY(v)} stroke="#0f2240" strokeWidth="1"/>
      ))}
      {!mini && [0,50,100].map(v=>(
        <text key={v} x={pad.l-4} y={scaleY(v)+4} textAnchor="end" fontSize="9" fill="#4a6888">{v}</text>
      ))}
      {mini && [['LOW',0],['HIGH',100]].map(([l,v])=>(
        <text key={l} x={pad.l-3} y={scaleY(v)+4} textAnchor="end" fontSize="8" fill="#4a6888">{l}</text>
      ))}
      {fill && <path d={areaD} fill={`url(#${id})`}/>}
      <polyline points={linePts} fill="none" stroke={color} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={mini?2:3} fill={color}/>)}
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r={mini?4:5} fill="#fff" stroke={color} strokeWidth="2"/>
      {data.map((d,i)=>(
        <text key={i} x={scaleX(i)} y={H-pad.b+(mini?14:16)} textAnchor="middle" fontSize={mini?9:10} fill="#4a6888">{d.month}</text>
      ))}
    </svg>
  );
}

function GaugeChart({ score }) {
  const cx=180, cy=172, r=138, sw=22;
  const polar = deg => ({x: cx+r*Math.cos(deg*Math.PI/180), y: cy-r*Math.sin(deg*Math.PI/180)});
  const s2a = s => 180 - s*1.8;
  const arc = (s1,s2) => {
    const p1=polar(s2a(s1)), p2=polar(s2a(s2));
    return `M${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A${r} ${r} 0 0 0 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  };
  const segs = [{from:0,to:20,color:'#22c55e'},{from:20,to:40,color:'#84cc16'},{from:40,to:60,color:'#eab308'},{from:60,to:80,color:'#f97316'},{from:80,to:100,color:'#dc2626'}];
  const na=s2a(score), nl=r-20;
  const nx=cx+nl*Math.cos(na*Math.PI/180), ny=cy-nl*Math.sin(na*Math.PI/180);
  const zoneLbls = [{s:5,lines:['OPTIMISM'],a:'end'},{s:30,lines:['CONFIDENCE'],a:'end'},{s:70,lines:['HIGH','ANXIETY'],a:'start'},{s:93,lines:['EXTREME','STRESS'],a:'start'}];
  return (
    <svg viewBox="0 0 360 205" style={{width:'100%',maxWidth:360,display:'block'}}>
      <path d={arc(0,100)} fill="none" stroke="#0f2240" strokeWidth={sw+4} strokeLinecap="butt"/>
      {segs.map((s,i)=><path key={i} d={arc(s.from,s.to)} fill="none" stroke={s.color} strokeWidth={sw} strokeLinecap="butt"/>)}
      <line x1={cx} y1={cy} x2={nx.toFixed(2)} y2={ny.toFixed(2)} stroke="#fff" strokeWidth="2.5" strokeLinecap="round"/>
      <circle cx={cx} cy={cy} r="7" fill="#0f2240" stroke="#fff" strokeWidth="2"/>
      <text x={cx} y={cy-42} textAnchor="middle" fontSize="52" fontWeight="800" fill="#fff">{score}</text>
      {zoneLbls.map((lbl,i)=>{
        const a=s2a(lbl.s), lr=r+22;
        const lx=cx+lr*Math.cos(a*Math.PI/180), ly=cy-lr*Math.sin(a*Math.PI/180);
        return lbl.lines.map((line,j)=>(
          <text key={`${i}-${j}`} x={lx.toFixed(1)} y={(ly+j*11).toFixed(1)} textAnchor={lbl.a} fontSize="8.5" fill="#4a6888" fontWeight="600">{line}</text>
        ));
      })}
      <text x="22" y={cy+18} textAnchor="middle" fontSize="10" fill="#4a6888">0</text>
      <text x="338" y={cy+18} textAnchor="middle" fontSize="10" fill="#4a6888">100</text>
    </svg>
  );
}

const ECOL = {anxiety:'#f97316',confusion:'#eab308',frustration:'#ef4444',optimism:'#22c55e',hopelessness:'#dc2626'};
function EmotionBars({ emotions }) {
  return (
    <div className="emotion-grid">
      {Object.entries(emotions).map(([k,v])=>(
        <div key={k} className="emotion-row">
          <span className="e-label">{k[0].toUpperCase()+k.slice(1)}</span>
          <div className="e-track"><div className="e-fill" style={{width:`${Math.round(v*100)}%`,background:ECOL[k]||'#2d7dd2'}}/></div>
          <span className="e-pct">{Math.round(v*100)}%</span>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [ts, setTs] = useState(null);

  const fetchData = useCallback(async () => {
    try {
      const r = await fetch('/api/sentiment');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      setData(await r.json());
      setTs(new Date());
      setError(null);
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { fetchData(); const id=setInterval(fetchData,300000); return ()=>clearInterval(id); }, [fetchData]);

  if (loading) return (
    <div className="loading">
      <div className="spinner"/>
      <div style={{color:'#4a6888',fontSize:14}}>Fetching live borrower data…</div>
      <div style={{color:'#2a4a68',fontSize:12}}>Reddit · CFPB · Claude AI</div>
    </div>
  );
  if (error && !data) return (
    <div className="loading">
      <div style={{color:'#ef4444',fontSize:18}}>⚠️ Connection Error</div>
      <div style={{color:'#4a6888',fontSize:13,marginTop:8}}>{error}</div>
      <button onClick={fetchData} style={{marginTop:20,padding:'10px 24px',borderRadius:8,background:'#1a6eb5',color:'#fff',border:'none',cursor:'pointer'}}>Retry</button>
    </div>
  );

  const d = data;
  const sc = d.index_score<=20?'#dc2626':d.index_score<=40?'#f97316':d.index_score<=60?'#eab308':d.index_score<=80?'#84cc16':'#22c55e';
  const icons = {search:'🔵',alert:'🔔',card:'💳',people:'👥'};

  return (
    <div className="dashboard">
      <header className="header">
        <div className="header-left">
          <div className="logo-icon">📊</div>
          <span className="logo-name">Loan Clarity</span>
          <span className="logo-sub">Student Loan Borrower Sentiment Index™</span>
        </div>
        <div className="header-right">
          <div className="live-badge"><div className="live-dot"/>LIVE · {ts?ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—'}</div>
          <div className="hbtn" onClick={fetchData} title="Refresh">↻</div>
          <div className="hbtn">🔔</div>
        </div>
      </header>

      <div className="kpi-bar">
        {d.kpi_bar.map((item,i)=>(
          <div key={i} className="kpi-item">
            <div className="kpi-label">{item.label}</div>
            <div className={`kpi-value c-${item.color}`}><span>▲</span>{item.value}</div>
          </div>
        ))}
      </div>

      <div className="main-grid">
        <div className="gauge-panel">
          <div className="panel-label">Current Index:</div>
          <div style={{padding:'0 8px'}}><GaugeChart score={d.index_score}/></div>
          <div>
            <div className="gauge-status" style={{color:sc}}>Status: {d.status.toUpperCase()}</div>
            <div className="gauge-updated">Last Update: {d.last_updated}</div>
          </div>
          <div>
            <div className="panel-label" style={{marginBottom:10}}>Borrower Emotions</div>
            <EmotionBars emotions={d.emotions}/>
          </div>
        </div>

        <div className="center-panel">
          <div>
            <div className="ct-title">Sentiment Trend — 6-Month View</div>
            <div className="ct-sub">Weighted: Google Trends · Reddit · CFPB · Delinquency · Refinance · Survey</div>
          </div>
          <SvgChart data={d.trend_history} color="#2d7dd2" fill={true} height={200}/>
          {d.ai_summary && (
            <div className="ai-box">
              <div className="ai-lbl">🤖 Claude AI · {d.signals.reddit.posts} Reddit posts analyzed</div>
              <div className="ai-text">"{d.ai_summary}"</div>
            </div>
          )}
          <div>
            <div className="panel-label" style={{marginBottom:8}}>Live Reddit Posts</div>
            {(d.trending_posts||[]).slice(0,4).map((p,i)=>(
              <div key={i} className="post-row">
                <span className="post-sub">r/{p.subreddit}</span>
                <span className="post-title">{p.title}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="right-panel">
          <div>
            <div className="section-hdr">Borrower Pulse</div>
            <div className="pulse-list">
              {d.borrower_pulse.map((item,i)=>(
                <div key={i} className="pulse-item">
                  <div className="pulse-dot" style={{background:item.color==='red'?'#ef4444':item.color==='yellow'?'#eab308':'#22c55e'}}/>
                  <div>
                    <div className="pulse-title">{item.title}</div>
                    {item.detail&&<div className="pulse-detail">{item.detail}</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div className="section-hdr">Sentiment Trend</div>
            <div style={{marginTop:10}}><SvgChart data={d.trend_history} color="#eab308" fill={false} height={120} mini={true}/></div>
          </div>
          {d.trending_topics&&d.trending_topics.length>0&&(
            <div>
              <div className="section-hdr">AI-Detected Themes</div>
              <div style={{marginTop:10}}>
                {d.trending_topics.map((t,i)=>(
                  <div key={i} className="topic-row"><span className="topic-num">#{i+1}</span>{t}</div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      <div className="bottom-section">
        <div className="bottom-title">Key Metrics</div>
        <div className="metrics-grid">
          {d.key_metrics.map((m,i)=>(
            <div key={i} className="metric-card">
              <div className="metric-icon">{icons[m.icon]||'📌'}</div>
              <div>
                <div className="metric-label">{m.label}</div>
                <div className={`metric-value c-${m.color}`}>{m.value}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="signals-section">
        <div className="bottom-title">Index Signal Breakdown</div>
        <div className="signals-grid">
          {Object.entries(d.signals).map(([key,sig])=>{
            const label=key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
            const c=sig.score<=20?'#dc2626':sig.score<=40?'#f97316':sig.score<=60?'#eab308':sig.score<=80?'#84cc16':'#22c55e';
            return (
              <div key={key} className="sig-card">
                <div className="sig-name">{label}</div>
                <div className="sig-score" style={{color:c}}>{sig.score}</div>
                <div className="sig-weight">{sig.weight}</div>
                <div className="sig-note">{sig.posts?`${sig.posts} posts`:sig.complaints_90d?`${sig.complaints_90d.toLocaleString()} complaints`:sig.raw?`index: ${sig.raw}`:sig.note||''}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

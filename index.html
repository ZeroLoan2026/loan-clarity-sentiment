<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Clarity — How stressed are student loan borrowers right now?</title>
  <meta name="description" content="The real-time stress index for 45 million student loan borrowers. You're not crazy. Your panic is data."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #050b16;
      --panel:    #07111f;
      --card:     #0b1626;
      --card-2:   #0f1d33;
      --border:   #16294a;
      --border-2: #1e3a5f;
      --text:     #e6eef7;
      --muted:    #6f88a5;
      --muted-2:  #4a6888;
      --accent:   #2d7dd2;
      --accent-2: #6fb6ff;
      --green: #22c55e; --orange:#f97316; --red:#ef4444; --yellow:#eab308; --blue:#3b82f6;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      /* ── Consumer rebrand: vibrant gradient accents ─────────── */
      --hot:      #ff5577;   /* hot coral — CTAs, urgency */
      --hot-2:    #ff8a3d;   /* peachy orange */
      --neon:     #00e5a8;   /* neon mint — wins, money-saved */
      --electric: #5b8cff;   /* electric blue */
      --grad-hot:    linear-gradient(135deg, #ff5577 0%, #ff8a3d 100%);
      --grad-cool:   linear-gradient(135deg, #5b8cff 0%, #00e5a8 100%);
      --grad-money:  linear-gradient(135deg, #00e5a8 0%, #5b8cff 100%);
      --grad-night:  linear-gradient(135deg, #0a1730 0%, #1a0f2e 100%);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; padding-top: 64px; }
    a { color: inherit; text-decoration: none; }

    .mono { font-family: var(--mono); }

    /* ── Loading ─────────────────────────────────────────────── */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
    .spinner { width: 48px; height: 48px; border: 3px solid var(--border-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Header / Nav ────────────────────────────────────────── */
    .dashboard { max-width: 1440px; margin: 0 auto; padding-bottom: 32px; }
    .header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 14px 28px; border-bottom: 1px solid var(--border);
      background: rgba(7, 17, 31, 0.92);
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .header-left { display: flex; align-items: center; gap: 28px; justify-self: start; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg,#1a6eb5,var(--accent)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 0 14px rgba(45,125,210,.25); }
    .logo-name { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    .logo-sub { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 32px; justify-self: center; }
    .nav-links a { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding: 6px 0; border-bottom: 2px solid transparent; transition: all .15s; }
    .nav-links a:hover { color: var(--accent-2); }
    .nav-links a.active { color: #fff; border-bottom-color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 10px; justify-self: end; }
    .live-badge { display: flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--border-2); padding: 5px 13px; border-radius: 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .hbtn { width: 32px; height: 32px; border-radius: 7px; background: var(--card); border: 1px solid var(--border-2); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: var(--muted); transition: all .15s; }
    .hbtn:hover { background: var(--card-2); color: var(--accent-2); }

    /* ── July 1 countdown banner ──────────────────────────────── */
    .j1-banner { display: block; text-decoration: none; background: linear-gradient(90deg, rgba(249,115,22,.18) 0%, rgba(234,179,8,.10) 50%, rgba(239,68,68,.18) 100%); border-bottom: 1px solid rgba(249,115,22,.35); transition: filter .15s; cursor: pointer; }
    .j1-banner:hover { filter: brightness(1.15); }
    .j1-banner.live { background: linear-gradient(90deg, rgba(239,68,68,.25) 0%, rgba(249,115,22,.18) 100%); }
    .j1-banner-inner { max-width: 1440px; margin: 0 auto; padding: 11px 28px; display: flex; align-items: center; gap: 16px; font-size: 12px; color: #fff; flex-wrap: wrap; }
    .j1-pulse { width: 8px; height: 8px; border-radius: 50%; background: #f97316; box-shadow: 0 0 10px #f97316; animation: j1pulse 1.6s ease-in-out infinite; flex-shrink: 0; }
    @keyframes j1pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
    .j1-lbl { font-weight: 800; letter-spacing: .12em; color: #fbbf24; font-size: 11px; text-transform: uppercase; }
    .j1-cd { display: inline-flex; gap: 4px; align-items: baseline; font-family: var(--mono); }
    .j1-cd-num { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.02em; min-width: 22px; text-align: right; }
    .j1-cd-unit { font-size: 10px; color: #fbbf24; font-weight: 700; margin-right: 4px; }
    .j1-divider { width: 1px; height: 18px; background: rgba(255,255,255,.15); }
    .j1-msg { color: #e8eef7; font-weight: 500; }
    .j1-cta { margin-left: auto; color: #fbbf24; font-weight: 800; letter-spacing: .04em; font-size: 12px; }
    .j1-banner:hover .j1-cta { color: #fff; }
    @media (max-width: 760px) {
      .j1-banner-inner { padding: 10px 16px; gap: 10px; font-size: 11px; }
      .j1-divider, .j1-msg { display: none; }
      .j1-cta { margin-left: 0; font-size: 11px; }
      .j1-cd-num { font-size: 14px; }
    }

    /* ── Headline banner ─────────────────────────────────────── */
    .headline-banner {
      padding: 30px 32px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: radial-gradient(120% 140% at 50% 0%, rgba(45,125,210,.12) 0%, transparent 60%), var(--bg);
    }
    .headline-banner h1 {
      margin: 0;
      font-size: clamp(22px, 3.4vw, 38px);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.12;
      color: #fff;
    }
    .headline-banner h1 .hb-accent { color: var(--accent-2); }
    .headline-banner .hb-sub {
      margin-top: 9px;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted-2);
      font-family: var(--mono);
    }
    @media (max-width: 600px) { .headline-banner { padding: 22px 20px; } }

    /* ── Data provenance strip ───────────────────────────────── */
    .provenance {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 8px 22px; padding: 12px 24px; border-bottom: 1px solid var(--border);
      background: var(--bg); text-decoration: none; transition: background .15s;
    }
    .provenance:hover { background: rgba(45,125,210,.05); }
    .prov-lbl { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-2); }
    .prov-src { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
    .prov-src .dot { color: var(--border-2, #1e3a5f); margin-left: 22px; }
    @media (max-width: 600px) { .provenance { gap: 6px 14px; padding: 11px 16px; } .prov-src .dot { display:none; } }

    /* ── KPI bar ─────────────────────────────────────────────── */
    /* ── HERO Stress Index (TOP — main feature) ─────────────────── */
    .hero-stress {
      padding: 28px 32px 30px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #0a1730 0%, var(--bg) 100%);
      position: relative;
    }
    .hero-stress::before {
      content: ''; position: absolute; top:0; left:0; right:0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(45,125,210,.4) 50%, transparent 100%);
    }
    .hero-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
    .hero-label { font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--accent-2); text-transform: uppercase; }
    .hero-tm { display: inline-block; color: var(--accent); margin-left: 4px; font-weight: 400; }
    .hero-tagline { font-size: 13px; color: var(--muted); margin-top: 5px; max-width: 720px; line-height: 1.5; }
    .hero-body { display: grid; grid-template-columns: 460px 1fr; gap: 36px; align-items: center; }
    .hero-gauge-col { display: flex; flex-direction: column; align-items: center; }
    .hero-side { display: flex; flex-direction: column; gap: 16px; }
    .hero-status-line { font-size: 32px; font-weight: 900; letter-spacing: .02em; line-height: 1.1; }
    .hero-status-sub { font-size: 13px; color: var(--muted); margin-top: 8px; font-family: var(--mono); }
    .hero-status-sub b { font-family: 'Inter', sans-serif; color: inherit; }
    .hero-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .hero-mini { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; }
    .hero-mini-lbl { font-size: 9px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .13em; font-weight: 700; }
    .hero-mini-val { font-family: var(--mono); font-size: 18px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; }
    @media (max-width: 1000px) {
      .hero-body { grid-template-columns: 1fr; gap: 18px; }
    }

    /* ── Top history chart ─────────────────────────────────────── */
    .history-section { padding: 18px 28px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%); }
    .hist-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
    .hist-title-block { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .hist-title { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted-2); text-transform: uppercase; }
    .hist-now   { font-family: var(--mono); font-size: 28px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
    .hist-delta { font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 4px; }
    .hist-delta.up { color: #fb923c; background: rgba(249,115,22,.12); border: 1px solid rgba(249,115,22,.35); }
    .hist-delta.dn { color: #4ade80; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.35); }
    .hist-delta.fl { color: var(--muted); background: var(--card-2); border: 1px solid var(--border-2); }
    .hist-windowlabel { font-family: var(--mono); font-size: 10.5px; color: var(--muted-2); margin-left: 4px; }
    .hist-tabs { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
    .hist-tab { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 6px 12px; border-radius: 5px; cursor: pointer; color: var(--muted); transition: all .12s; border: none; background: transparent; position: relative; }
    .hist-tab:hover { color: var(--accent-2); }
    .hist-tab.active { background: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(45,125,210,.4); }
    .hist-tab.locked { color: #5a7d9d; opacity: .85; }
    .hist-tab.locked:hover { color: var(--accent-2); opacity: 1; }
    .hist-tab .lock-icon { font-size: 9px; margin-left: 4px; opacity: .8; }
    .hist-chart-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px 8px; position: relative; }

    /* ── Paywall overlay (locked time ranges) ──────────── */
    .hist-paywall { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,17,31,.55) 0%, rgba(7,17,31,.92) 60%); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; z-index: 5; }
    .hist-paywall-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #22c55e, #5ba3ec); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 30px rgba(45,125,210,.3); }
    .hist-paywall-title { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
    .hist-paywall-desc { font-size: 13px; color: var(--muted); max-width: 380px; line-height: 1.55; }
    .hist-paywall-cta { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; background: linear-gradient(135deg, #22c55e, #5ba3ec); color: #fff; border-radius: 8px; font-weight: 700; font-size: 13px; text-decoration: none; transition: transform .15s; margin-top: 4px; }
    .hist-paywall-cta:hover { transform: translateY(-1px); }
    .hist-paywall-meta { font-size: 11px; color: #4a6888; font-family: var(--mono); letter-spacing: .06em; }
    .hist-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: 10px; color: var(--muted-2); }

    /* Market context strip (macro tracker) */
    .market-strip { display: grid; grid-template-columns: 1.15fr 1fr 1fr 1fr; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #0a1730 0%, var(--panel) 100%); }
    .ms-cell { padding: 13px 22px; border-right: 1px solid var(--border); text-decoration: none; display: flex; flex-direction: column; justify-content: center; transition: background .15s; }
    .ms-cell:last-child { border-right: none; }
    .ms-cell:hover { background: rgba(45,125,210,.06); }
    .ms-live { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); }
    .ms-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: mspulse 1.5s infinite; }
    @keyframes mspulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ms-sub { font-size: 10px; color: var(--muted-2); font-family: var(--mono); letter-spacing: .04em; margin-top: 5px; }
    .ms-num { font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-family: var(--mono); line-height: 1; }
    .ms-lbl { font-size: 10px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin-top: 6px; }
    @media (max-width: 760px) { .market-strip { grid-template-columns: 1fr 1fr; } .ms-head { grid-column: 1 / -1; border-right: none; } }

    .kpi-bar { display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid var(--border); background: var(--panel); }
    .kpi-item { padding: 13px 22px; border-right: 1px solid var(--border); position: relative; cursor: pointer; transition: background .15s; }
    .kpi-item:hover { background: rgba(45, 125, 210, 0.06); }
    .kpi-item:last-child { border-right: none; }
    .kpi-label { font-size: 9.5px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
    .kpi-value { font-size: 17px; font-weight: 800; margin-top: 4px; display: flex; align-items: center; gap: 6px; font-family: var(--mono); letter-spacing: -.01em; }
    .kpi-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
    .c-green  { color: var(--green); } .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-yellow { color: var(--yellow); }

    /* ── Source tag (inline attribution) ─────────────────────── */
    .src-tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 9.5px; color: var(--muted-2);
      cursor: pointer; padding: 2px 7px; border-radius: 10px;
      border: 1px solid transparent; transition: all .12s; position: relative;
      letter-spacing: .02em;
    }
    .src-tag:hover { background: var(--card-2); border-color: var(--border-2); color: var(--accent-2); }
    .src-tag .ic { font-size: 8px; opacity: .8; }
    .src-pop {
      position: absolute; bottom: calc(100% + 8px); left: 0; min-width: 280px; max-width: 340px;
      background: var(--card-2); border: 1px solid var(--border-2); border-radius: 8px;
      padding: 12px 14px; z-index: 100; box-shadow: 0 12px 32px rgba(0,0,0,.55);
      pointer-events: none; opacity: 0; transform: translateY(4px); transition: all .18s;
      font-family: 'Inter', sans-serif;
    }
    .src-tag:hover .src-pop, .src-tag:focus-within .src-pop { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .src-pop .sp-lbl { font-size: 8.5px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .15em; font-weight: 700; margin-bottom: 3px; }
    .src-pop .sp-name { font-size: 12px; color: #fff; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
    .src-pop .sp-meta { font-size: 10.5px; color: var(--muted); margin-bottom: 8px; }
    .src-pop .sp-actions { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-2); }
    .src-pop a { flex: 1; padding: 6px 8px; border-radius: 4px; font-size: 10px; text-align: center; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--panel); border: 1px solid var(--border-2); color: var(--accent-2); transition: all .12s; }
    .src-pop a:hover { background: var(--accent); color: #fff; border-color: transparent; }

    /* ── Main grid ───────────────────────────────────────────── */
    .main-grid { display: grid; grid-template-columns: 380px 1fr 340px; border-bottom: 1px solid var(--border); }
    .panel { padding: 22px 22px; }
    .gauge-panel { border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; }
    .center-panel { border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 18px; }
    .right-panel { display: flex; flex-direction: column; gap: 22px; }

    .panel-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--muted-2); text-transform: uppercase; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .panel-head .ph-l { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--muted-2); text-transform: uppercase; }

    .gauge-status { font-size: 18px; font-weight: 800; letter-spacing: .04em; }
    .gauge-updated { font-size: 11px; color: var(--muted-2); margin-top: 4px; }

    /* Emotions */
    .emotion-grid { display: flex; flex-direction: column; gap: 8px; }
    .emotion-row { display: flex; align-items: center; gap: 9px; }
    .e-label { font-size: 11px; color: #8ab0d8; width: 88px; flex-shrink: 0; font-weight: 500; }
    .e-track { flex:1; height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
    .e-fill  { height: 100%; border-radius: 3px; transition: width 1s ease; box-shadow: 0 0 8px currentColor; }
    .e-pct   { font-size: 11px; color: var(--muted-2); width: 32px; text-align: right; font-family: var(--mono); }

    /* Drivers panel */
    .drivers-card {
      background: linear-gradient(180deg, var(--card) 0%, var(--panel) 100%);
      border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
    }
    .d-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
    .d-head .d-from-to { font-family: var(--mono); font-size: 13px; color: var(--text); }
    .d-head .d-delta { font-family: var(--mono); font-size: 14px; font-weight: 700; padding: 3px 9px; border-radius: 4px; }
    .d-delta.up { color: var(--orange); background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.3); }
    .d-delta.dn { color: var(--green);  background: rgba(34,197,94,.1);  border: 1px solid rgba(34,197,94,.3); }
    .d-delta.fl { color: var(--muted); background: var(--card-2); border: 1px solid var(--border-2); }
    .d-window { font-size: 10px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .1em; font-family: var(--mono); }
    .d-list { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
    .d-row { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; color: #c0d8f0; line-height: 1.45; }
    .d-bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
    .d-sigdeltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .sigd { font-family: var(--mono); font-size: 10.5px; padding: 4px 9px; border-radius: 4px; background: var(--card-2); border: 1px solid var(--border-2); color: var(--muted); }
    .sigd .sd-name { color: var(--text); margin-right: 6px; }
    .sigd .sd-up { color: var(--orange); }
    .sigd .sd-dn { color: var(--green); }

    /* Center panel */
    .ct-title { font-size: 16px; font-weight: 700; color: #e8f1fb; letter-spacing: -.01em; }
    .ct-sub { font-size: 11px; color: var(--muted-2); margin-top: 3px; }
    .ai-box { background: var(--card); border: 1px solid var(--border-2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 13px 16px; transition: all .15s; }
    .ai-box:hover { border-color: var(--accent); background: var(--card-2); }
    .gauge-wrap { padding: 0 8px; border-radius: 12px; transition: all .15s; }
    .gauge-wrap:hover { background: rgba(45,125,210,0.04); }
    .emotions-wrap { padding: 8px 0; border-radius: 6px; transition: all .15s; }
    .emotions-wrap:hover { background: rgba(45,125,210,0.04); }
    .chart-wrap { padding: 4px; border-radius: 8px; transition: all .15s; }
    .chart-wrap:hover { background: rgba(45,125,210,0.04); }
    .drivers-card { cursor: pointer; transition: all .15s; }
    .drivers-card:hover { border-color: var(--accent); }
    .ai-lbl  { font-size: 10px; color: var(--accent-2); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
    .ai-text { font-size: 13px; color: #c0d8f0; margin-top: 6px; line-height: 1.55; font-style: italic; }
    .post-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 9px 13px; margin-bottom: 5px; transition: all .15s; }
    .post-row:hover { border-color: var(--border-2); background: var(--card-2); }
    .post-sub  { font-family: var(--mono); font-size: 10px; color: var(--accent-2); white-space: nowrap; flex-shrink: 0; font-weight: 500; }
    .post-title{ font-size: 12px; color: #c0d8f0; line-height: 1.4; flex: 1; }
    .post-link { font-size: 10px; color: var(--muted-2); }

    /* Right panel */
    .section-hdr { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--muted-2); text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .pulse-list { display: flex; flex-direction: column; gap: 9px; margin-top: 10px; }
    .pulse-item { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; cursor: pointer; text-decoration: none; color: inherit; transition: all .15s; }
    .pulse-item:hover { border-color: var(--accent); background: var(--card-2); }
    .pulse-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; box-shadow: 0 0 6px currentColor; }
    .pulse-body { flex: 1; min-width: 0; }
    .pulse-title { font-size: 12px; font-weight: 600; color: #e0f0ff; line-height: 1.35; }
    .pulse-detail { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .pulse-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .ts-mono { font-family: var(--mono); font-size: 9.5px; color: var(--muted-2); letter-spacing: .02em; }

    .topic-row { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 11px; font-size: 11px; color: #c0d8f0; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; cursor: pointer; text-decoration: none; transition: all .15s; }
    .topic-row:hover { border-color: var(--accent); background: var(--card-2); color: #fff; }
    .topic-num { font-family: var(--mono); font-size: 10px; color: var(--accent); }
    .topic-row .ext { margin-left: auto; opacity: .5; font-size: 10px; }

    /* Bottom metrics */
    .bottom-section { padding: 22px 28px; }
    .bottom-title { display: flex; align-items: center; justify-content: space-between; padding-bottom: 9px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .bottom-title .bt-l { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--muted-2); text-transform: uppercase; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
    .metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; transition: all .15s; cursor: pointer; text-decoration: none; color: inherit; }
    .metric-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,.3); }
    .metric-card .ext-icon { font-size: 11px; color: var(--muted-2); opacity: 0; transition: opacity .15s; }
    .metric-card:hover .ext-icon { opacity: 1; color: var(--accent-2); }
    .metric-head { display: flex; align-items: flex-start; gap: 10px; }
    .metric-icon { width: 32px; height: 32px; border-radius: 7px; background: var(--card-2); border: 1px solid var(--border-2); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .metric-label { font-size: 11px; color: var(--muted); line-height: 1.35; flex: 1; }
    .metric-value { font-size: 22px; font-weight: 800; font-family: var(--mono); letter-spacing: -.02em; }
    .metric-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px; }

    .signals-section { padding: 0 28px 28px; }
    .signals-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; }
    .sig-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; transition: all .15s; cursor: pointer; text-decoration: none; color: inherit; }
    .sig-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.25); }
    .sig-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .sig-name { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; line-height: 1.3; }
    .sig-weight { font-family: var(--mono); font-size: 10px; color: var(--accent); font-weight: 600; padding: 2px 6px; border: 1px solid var(--border-2); border-radius: 3px; flex-shrink: 0; }
    .sig-score { font-size: 28px; font-weight: 800; font-family: var(--mono); margin: 2px 0; letter-spacing: -.03em; }
    .sig-raw { font-size: 10px; color: var(--muted-2); font-family: var(--mono); }
    .sig-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--border); }

    /* ══════════════════════════════════════════════════════════════════════
       CONSUMER REBRAND — CTAs, lead-gen sections, social proof, footer
       ══════════════════════════════════════════════════════════════════════ */

    /* Headline accent gradient text */
    .grad-text { background: var(--grad-cool); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .grad-hot-text { background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* Generic CTA buttons */
    .cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 24px; border-radius: 999px; font-weight: 800;
      font-size: 14px; letter-spacing: .02em; text-decoration: none;
      transition: transform .15s, box-shadow .15s, filter .15s;
      cursor: pointer; border: none; white-space: nowrap;
    }
    .cta:hover { transform: translateY(-2px); }
    .cta-primary { background: var(--grad-hot); color: #fff; box-shadow: 0 8px 24px rgba(255,85,119,.35); }
    .cta-primary:hover { filter: brightness(1.08); box-shadow: 0 12px 30px rgba(255,85,119,.5); }
    .cta-money { background: var(--grad-money); color: #07111f; box-shadow: 0 8px 24px rgba(0,229,168,.3); }
    .cta-money:hover { filter: brightness(1.08); }
    .cta-ghost { background: rgba(91,140,255,.08); color: #cfe1ff; border: 1px solid rgba(91,140,255,.35); }
    .cta-ghost:hover { background: rgba(91,140,255,.15); border-color: var(--electric); }
    .cta-sm { padding: 10px 16px; font-size: 12px; }
    .cta-lg { padding: 16px 30px; font-size: 15px; }

    /* HERO CTA bar — appears right under the stress gauge */
    .hero-cta-bar {
      padding: 22px 32px;
      background: linear-gradient(180deg, rgba(10,23,48,.4) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    .hero-cta-inner {
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
    }
    .hero-cta-copy { display: flex; flex-direction: column; gap: 4px; }
    .hero-cta-eyebrow { font-size: 11px; letter-spacing: .18em; font-weight: 800; text-transform: uppercase; color: var(--neon); }
    .hero-cta-h {
      font-size: 26px; font-weight: 900; line-height: 1.15; letter-spacing: -.02em; color: #fff;
    }
    .hero-cta-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .hero-cta-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    @media(max-width:760px){
      .hero-cta-bar { padding: 18px 16px; }
      .hero-cta-inner { grid-template-columns: 1fr; gap: 14px; }
      .hero-cta-h { font-size: 20px; }
      .hero-cta-btns { width: 100%; }
      .hero-cta-btns .cta { flex: 1; }
    }

    /* ══════════════════════════════════════════════════════════════════════
       SIMPLIFIED DASHBOARD — primary CTA, trust strip, mini footer
       ══════════════════════════════════════════════════════════════════════ */
    .grad-money-text { background: var(--grad-money); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* ── Action row: newsletter + collab side-by-side ────────────────── */
    .action-row {
      padding: 20px 32px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .ar-inner {
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch;
    }
    .ar-card {
      background: linear-gradient(180deg, var(--card) 0%, var(--panel) 100%);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .ar-card.news {
      background:
        radial-gradient(ellipse at right, rgba(91,140,255,.10) 0%, transparent 60%),
        linear-gradient(180deg, var(--card) 0%, var(--panel) 100%);
      border-color: rgba(91,140,255,.35);
    }
    /* ── Collab card ─────────────────────────────────────────────────── */
    .ar-card.collab {
      position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse at top left,  rgba(255,30,60,.18) 0%, transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(255,80,30,.12) 0%, transparent 55%),
        linear-gradient(160deg, #1a0a0f 0%, #0f0508 100%);
      border-color: rgba(255,45,70,.45);
      box-shadow: 0 0 0 1px rgba(255,45,70,.12) inset, 0 8px 32px rgba(255,30,60,.08);
    }
    .ar-card.collab::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        135deg,
        transparent 0px, transparent 18px,
        rgba(255,45,70,.025) 18px, rgba(255,45,70,.025) 19px
      );
    }
    .ar-eyebrow {
      font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      position: relative;
    }
    .ar-eyebrow.cool  { color: var(--electric); }
    .ar-eyebrow.fire  { color: #ff3d57; }
    .ar-h {
      font-size: 16px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; color: #fff;
      position: relative;
    }
    .ar-h .grad-cool { background: var(--grad-cool); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ar-h .grad-fire { background: linear-gradient(90deg,#ff3d57,#ff8c42); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ar-sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; position: relative; }
    .ar-tags { display: flex; gap: 6px; flex-wrap: wrap; position: relative; }
    .ar-tag {
      font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(255,45,70,.15); color: #ff7088; border: 1px solid rgba(255,45,70,.3);
    }
    /* Red collab button */
    .btn-collab {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: auto; padding: 13px 20px; border-radius: 12px;
      background: linear-gradient(135deg, #ff1f3d 0%, #e0102e 60%, #c00020 100%);
      color: #fff; font-weight: 900; font-size: 14px; letter-spacing: .02em;
      text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,30,60,.45), 0 0 0 1px rgba(255,80,80,.2) inset;
      transition: transform .15s, box-shadow .15s, filter .15s;
      position: relative; overflow: hidden;
    }
    .btn-collab::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, transparent 50%);
      pointer-events: none;
    }
    .btn-collab:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255,30,60,.6), 0 0 0 1px rgba(255,100,100,.25) inset;
      filter: brightness(1.06);
    }
    .btn-collab:active { transform: translateY(0); }
    .btn-collab-icon { font-size: 17px; line-height: 1; }
    /* Newsletter form */
    .news-form { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .news-form .row { display: flex; gap: 8px; }
    .news-form input {
      flex: 1; background: rgba(7,17,31,.85); border: 1px solid var(--border-2);
      border-radius: 8px; padding: 10px 13px; color: #fff; font-size: 13px;
      font-family: inherit; font-weight: 500; outline: none; transition: border-color .15s;
    }
    .news-form input:focus { border-color: var(--electric); }
    .news-form input::placeholder { color: var(--muted-2); }
    .news-form .btn-sub {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: 13px;
      background: var(--grad-cool); color: #07111f; border: none; cursor: pointer;
      letter-spacing: .02em; transition: transform .15s, filter .15s;
      white-space: nowrap;
    }
    .news-form .btn-sub:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .news-form .btn-sub:disabled { opacity: .6; cursor: wait; transform: none; }
    .news-msg { font-size: 11.5px; padding: 6px 0; font-family: var(--mono); }
    .news-msg.ok  { color: var(--neon); }
    .news-msg.err { color: var(--hot); }
    @media(max-width:760px){
      .action-row { padding: 14px 14px; }
      .ar-inner { grid-template-columns: 1fr; gap: 10px; }
      .ar-card { padding: 16px 16px; }
      .news-form .row { flex-direction: column; }
    }

    .trust-mini {
      padding: 14px 32px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap;
      font-size: 12.5px; color: var(--muted); font-family: var(--mono);
    }
    .trust-mini span { white-space: nowrap; }
    @media(max-width:760px){
      .trust-mini { font-size: 11px; padding: 12px 14px; gap: 10px; }
    }

    /* ── Bottom affiliate banner (SoFi) ──────────────────────────────── */
    .affiliate-bar {
      padding: 20px 32px;
      background:
        radial-gradient(ellipse at right, rgba(0,229,168,.10) 0%, transparent 55%),
        linear-gradient(180deg, #0b1a2e 0%, var(--panel) 100%);
      border-top: 1px solid rgba(0,229,168,.18);
      border-bottom: 1px solid var(--border);
    }
    .affiliate-bar-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    }
    .affiliate-bar-left { display: flex; flex-direction: column; gap: 4px; }
    .affiliate-bar-eyebrow {
      font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
      color: var(--neon);
    }
    .affiliate-bar-h {
      font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.01em; line-height: 1.2;
    }
    .affiliate-bar-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .affiliate-bar-disc { font-size: 10px; color: var(--muted-2); margin-top: 8px; }
    @media(max-width:760px){
      .affiliate-bar { padding: 16px 14px; }
      .affiliate-bar-inner { flex-direction: column; align-items: flex-start; gap: 14px; }
      .affiliate-bar .cta { width: 100%; text-align: center; }
    }

    .mini-footer {
      padding: 24px 32px 32px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    .mf-row {
      max-width: 1100px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap;
    }
    .mf-brand { font-size: 12px; color: var(--muted); font-family: var(--mono); }
    .mf-links { display: flex; gap: 18px; }
    .mf-links a {
      font-size: 11px; color: var(--muted-2); font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; transition: color .15s;
    }
    .mf-links a:hover { color: var(--neon); }
    .mf-disc {
      max-width: 1100px; margin: 14px auto 0;
      font-size: 11px; color: var(--muted-2); text-align: center; line-height: 1.55;
    }
    @media(max-width:760px){
      .mini-footer { padding: 20px 14px 24px; }
      .mf-row { flex-direction: column; gap: 12px; text-align: center; }
      .mf-links { justify-content: center; }
    }

    /* ── Tax Optimizer featured CTA on dashboard ──────────────── */
    .tax-feature {
      display: block;
      margin: 0;
      background:
        radial-gradient(ellipse at right, rgba(0,229,168,.10) 0%, transparent 55%),
        var(--panel);
      border-bottom: 1px solid rgba(0,229,168,.3);
      text-decoration: none; color: inherit;
      transition: filter .2s;
    }
    .tax-feature:hover { filter: brightness(1.1); }
    .tax-feature-glow { display: none; }
    .tax-feature-content {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 14px 32px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap;
    }
    .tax-feature-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--neon);
      text-transform: uppercase;
    }
    .tax-feature-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 6px var(--neon); animation: pulse 1.4s infinite; }
    .tax-feature-h {
      font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; color: #fff;
      margin-top: 2px;
    }
    .tax-feature-grad { background: var(--grad-money); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tax-feature-sub, .tax-feature-bullets, .tax-feature-card-lbl, .tax-feature-card-sub { display: none; }
    .tax-feature-card {
      display: flex; align-items: center; gap: 12px;
      background: transparent; border: none; padding: 0; box-shadow: none;
    }
    .tax-feature-card-num {
      font-size: 22px; font-weight: 900; letter-spacing: -.02em;
      font-family: var(--mono);
      background: var(--grad-money); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tax-feature-cta {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 9px 16px; border-radius: 999px;
      background: var(--grad-money); color: #07111f;
      font-weight: 800; font-size: 12px; letter-spacing: .02em;
      box-shadow: 0 4px 14px rgba(0,229,168,.25);
      transition: transform .15s;
      white-space: nowrap;
    }
    .tax-feature:hover .tax-feature-cta { transform: translateY(-1px); }
    @media(max-width:760px){
      .tax-feature-content { padding: 12px 14px; gap: 10px; }
      .tax-feature-h { font-size: 14px; }
      .tax-feature-card-num { font-size: 18px; }
    }

    /* Social proof strip */
    .social-proof {
      display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: center;
      padding: 14px 32px; background: var(--panel); border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--muted); font-family: var(--mono);
    }
    .sp-item { display: flex; align-items: center; gap: 8px; }
    .sp-num { color: var(--neon); font-weight: 800; font-size: 14px; }
    .sp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); animation: pulse 1.6s infinite; }

    /* Big inline lead magnet (between sections) */
    .leadmag {
      margin: 24px 32px; border-radius: 16px;
      background:
        radial-gradient(ellipse at top right, rgba(255,85,119,.18) 0%, transparent 60%),
        radial-gradient(ellipse at bottom left, rgba(0,229,168,.15) 0%, transparent 60%),
        linear-gradient(180deg, #0d1a32 0%, #0a1426 100%);
      border: 1px solid var(--border-2);
      padding: 32px 36px;
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center;
      overflow: hidden; position: relative;
    }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

const ECOL = {anxiety:'#f97316',confusion:'#eab308',frustration:'#ef4444',optimism:'#22c55e',hopelessness:'#dc2626'};

// Make any element clickable to URL while letting inner <a> tags work normally
const linkTo = (url) => ({
  onClick: (e) => { if (e.target.closest('a')) return; if (url) window.open(url, '_blank', 'noopener,noreferrer'); },
  style: { cursor: 'pointer' },
  title: 'Click to view source',
});

// ─── Source tag with hover popover ────────────────────────────────────────
function SrcTag({ source, source_url, updated_at, methodology_ref, label, compact }) {
  if (!source) return null;
  const shortName = source.length > 32 ? source.slice(0, 30) + '…' : source;
  return (
    <span className="src-tag" tabIndex={0}>
      <span className="ic">◉</span>
      <span>{compact ? 'SRC' : shortName}</span>
      <span className="src-pop">
        <div className="sp-lbl">Source</div>
        <div className="sp-name">{source}</div>
        {updated_at && <div className="sp-meta mono">Updated · {updated_at}</div>}
        <div className="sp-actions">
          {source_url && <a href={source_url} target="_blank" rel="noopener">Visit Source ↗</a>}
          {methodology_ref && <a href={methodology_ref}>Methodology</a>}
        </div>
      </span>
    </span>
  );
}

// ─── July 1, 2026 — slim countdown banner on dashboard ───────────────────
function MarketStrip() {
  // Macro market context — figures sourced from Federal Reserve / NY Fed Household Debt & Credit Report.
  const stats = [
    { num: '$1.7T', lbl: 'Total market size', color: 'var(--green)' },
    { num: '45M',   lbl: 'Borrowers in the U.S.', color: 'var(--orange)' },
    { num: '$37K',  lbl: 'Avg. borrower debt', color: '#fff' },
  ];
  return (
    <section className="market-strip">
      <a className="ms-cell ms-head" href="/sources?utm_source=dashboard&utm_medium=market-strip" title="Market data sources">
        <div className="ms-live"><span className="ms-dot"/>U.S. Student Loan Market</div>
        <div className="ms-sub">Live macro tracker · updated quarterly</div>
      </a>
      {stats.map((s, i) => (
        <a key={i} className="ms-cell" href="/sources?utm_source=dashboard&utm_medium=market-strip" title="View data sources">
          <div className="ms-num" style={{color: s.color}}>{s.num}</div>
          <div className="ms-lbl">{s.lbl}</div>
        </a>
      ))}
    </section>
  );
}

function July1Banner() {
  const target = useMemo(() => new Date(Date.UTC(2026, 6, 1, 4, 0, 0)), []); // July 1 2026 00:00 ET
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const ms = target - now;
  if (ms <= 0) {
    return (
      <a href="/july1?utm_source=dashboard&utm_medium=banner&utm_campaign=july1-live" className="j1-banner live">
        <div className="j1-banner-inner">
          <span className="j1-pulse"/><b>🚨 The July 1 rules are now in effect.</b>
          <span className="j1-cta">View live tracker →</span>
        </div>
      </a>
    );
  }
  const days  = Math.floor(ms / 86400000);
  const hours = Math.floor((ms % 86400000) / 3600000);
  const mins  = Math.floor((ms % 3600000) / 60000);
  const secs  = Math.floor((ms % 60000) / 1000);
  return (
    <a href="/july1?utm_source=dashboard&utm_medium=banner&utm_campaign=july1-countdown" className="j1-banner">
      <div className="j1-banner-inner">
        <span className="j1-pulse"/>
        <span className="j1-lbl">JULY 1 · STUDENT LOAN RULE CHANGES</span>
        <span className="j1-cd">
          <span className="j1-cd-num">{days}</span><span className="j1-cd-unit">d</span>
          <span className="j1-cd-num">{String(hours).padStart(2,'0')}</span><span className="j1-cd-unit">h</span>
          <span className="j1-cd-num">{String(mins).padStart(2,'0')}</span><span className="j1-cd-unit">m</span>
          <span className="j1-cd-num">{String(secs).padStart(2,'0')}</span><span className="j1-cd-unit">s</span>
        </span>
        <span className="j1-divider"/>
        <span className="j1-msg">Track borrower stress through the chaos</span>
        <span className="j1-cta">View tracker →</span>
      </div>
    </a>
  );
}

// ─── Multi-window history chart with time tabs ────────────────────────────
// FREE tier: 1W only. 1M, 3M, 6M, 1Y, 5Y are Pro-only (paywall overlay).
const WINDOWS = ['1W','1M','3M','6M','1Y','5Y'];
const FREE_WINDOW = '1W';
function HistoryChart({ history, currentScore }) {
  const [win, setWin] = useState(FREE_WINDOW);
  const isLocked = win !== FREE_WINDOW;

  // Use the 1W data underneath the paywall overlay so the locked tab still
  // shows a teaser chart (the same 7-day data, just with overlay on top).
  const dataWin = isLocked ? FREE_WINDOW : win;
  if (!history || !history[dataWin]) return null;
  const data = history[dataWin];
  const points = data.points;
  const W = 1200, H = 260;
  const pad = { t: 16, r: 18, b: 26, l: 38 };
  const minV = 0, maxV = 100;
  const scaleX = i => pad.l + (i / (points.length - 1)) * (W - pad.l - pad.r);
  const scaleY = v => pad.t + ((maxV - v) / (maxV - minV)) * (H - pad.t - pad.b);
  const pts = points.map((p, i) => [scaleX(i), scaleY(p.value)]);
  const linePts = pts.map(p => p.join(',')).join(' ');
  const areaD = `M${pts[0][0]},${pts[0][1]} ` +
    pts.slice(1).map(p => `L${p[0]},${p[1]}`).join(' ') +
    ` L${pts[pts.length-1][0]},${H-pad.b} L${pts[0][0]},${H-pad.b} Z`;
  const lineColor = data.delta > 0 ? '#fb923c' : data.delta < 0 ? '#22c55e' : '#2d7dd2';
  const dirCls = data.delta > 0 ? 'up' : data.delta < 0 ? 'dn' : 'fl';
  const sign = data.delta > 0 ? '+' : '';

  // Range labels
  const winLabels = {
    '1D':'Last 24 hours', '1W':'Last 7 days', '1M':'Last 30 days', '3M':'Last 3 months',
    '6M':'Last 6 months', '1Y':'Last 12 months', '3Y':'Last 3 years', '5Y':'Last 5 years'
  };

  return (
    <div className="history-section">
      <div className="hist-head">
        <div className="hist-title-block">
          <div>
            <div className="hist-title">
              Borrower Stress Index · {winLabels[isLocked ? win : FREE_WINDOW]}
              {isLocked && <span style={{marginLeft:8,fontSize:'11px',color:'#5ba3ec',fontWeight:700,letterSpacing:'.08em'}}>🔒 PRO</span>}
            </div>
            <div style={{display:'flex',alignItems:'baseline',gap:10,marginTop:4}}>
              <div className="hist-now">{currentScore}</div>
              {!isLocked && (
                <>
                  <div className={`hist-delta ${dirCls}`}>{sign}{data.delta} ({sign}{data.delta_pct}%)</div>
                  <div className="hist-windowlabel">vs {FREE_WINDOW} ago</div>
                </>
              )}
              {isLocked && (
                <div className="hist-windowlabel" style={{color:'#5ba3ec'}}>Subscribe to Pro for full history →</div>
              )}
            </div>
          </div>

// ─── SVG trend chart ──────────────────────────────────────────────────────
function SvgChart({ data, color, fill, height, mini }) {
  if (!data || data.length < 2) return null;
  const W = 560, H = height || 180;
  const pad = { t: 10, r: 10, b: mini ? 22 : 30, l: mini ? 28 : 34 };
  const minV = 0, maxV = 100;
  const scaleX = i => pad.l + (i / (data.length - 1)) * (W - pad.l - pad.r);
  const scaleY = v => pad.t + ((maxV - v) / (maxV - minV)) * (H - pad.t - pad.b);
  const pts = data.map((d, i) => [scaleX(i), scaleY(d.score)]);
  const linePts = pts.map(p => p.join(',')).join(' ');
  const areaD = `M${pts[0][0]},${pts[0][1]} ` +
    pts.slice(1).map(p => `L${p[0]},${p[1]}`).join(' ') +
    ` L${pts[pts.length-1][0]},${H-pad.b} L${pts[0][0]},${H-pad.b} Z`;
  const id = `g${color.replace('#','')}`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.02"/>
        </linearGradient>
      </defs>
      {[0,25,50,75,100].map(v=>(
        <line key={v} x1={pad.l} y1={scaleY(v)} x2={W-pad.r} y2={scaleY(v)} stroke="#0f1d33" strokeWidth="1"/>
      ))}
      {!mini && [0,50,100].map(v=>(
        <text key={v} x={pad.l-4} y={scaleY(v)+4} textAnchor="end" fontSize="9" fill="#4a6888" fontFamily="JetBrains Mono">{v}</text>
      ))}
      {mini && [['LOW',0],['HIGH',100]].map(([l,v])=>(
        <text key={l} x={pad.l-3} y={scaleY(v)+4} textAnchor="end" fontSize="8" fill="#4a6888" fontFamily="JetBrains Mono">{l}</text>
      ))}
      {fill && <path d={areaD} fill={`url(#${id})`}/>}
      <polyline points={linePts} fill="none" stroke={color} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={mini?2:3} fill={color}/>)}
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r={mini?4:5} fill="#fff" stroke={color} strokeWidth="2"/>
      {data.map((d,i)=>(
        <text key={i} x={scaleX(i)} y={H-pad.b+(mini?14:16)} textAnchor="middle" fontSize={mini?9:10} fill="#4a6888" fontFamily="JetBrains Mono">{d.month}</text>
      ))}
    </svg>
  );
}

// ─── Gauge ────────────────────────────────────────────────────────────────
function GaugeChart({ score }) {
  const cx=200, cy=190, r=140, sw=26;
  const polar = deg => ({x: cx+r*Math.cos(deg*Math.PI/180), y: cy-r*Math.sin(deg*Math.PI/180)});
  const s2a = s => 180 - s*1.8;
  const arc = (s1,s2) => {
    const p1=polar(s2a(s1)), p2=polar(s2a(s2));
    return `M${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A${r} ${r} 0 0 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  };
  const zoneColor = score <= 20 ? '#22c55e' : score <= 40 ? '#84cc16' : score <= 60 ? '#eab308' : score <= 80 ? '#f97316' : '#dc2626';
  const na=s2a(score);
  const mx=cx+r*Math.cos(na*Math.PI/180), my=cy-r*Math.sin(na*Math.PI/180);
  const xL=cx-r, xR=cx+r;
  const zoneLbls = [{s:7,t:'CHILL'},{s:30,t:'CALM'},{s:50,t:'MID'},{s:70,t:'TENSE'},{s:93,t:'PANIC'}];
  return (
    <svg viewBox="0 0 400 310" style={{width:'100%',maxWidth:400,display:'block',overflow:'visible'}}>
      <defs>
        <linearGradient id="arcGrad" gradientUnits="userSpaceOnUse" x1={xL} y1="0" x2={xR} y2="0">
          <stop offset="0%" stopColor="#22c55e"/><stop offset="25%" stopColor="#84cc16"/><stop offset="50%" stopColor="#eab308"/><stop offset="75%" stopColor="#f97316"/><stop offset="100%" stopColor="#dc2626"/>
        </linearGradient>
        <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="markerGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path d={arc(0,100)} fill="none" stroke="#0f2240" strokeWidth={sw+8} strokeLinecap="round"/>
      <path d={arc(0,100)} fill="none" stroke="url(#arcGrad)" strokeWidth={sw} strokeLinecap="round"/>
      {[20,40,60,80].map(s => {
        const a = s2a(s); const r1 = r-sw/2-3, r2 = r+sw/2+3;
        const x1 = cx+r1*Math.cos(a*Math.PI/180), y1 = cy-r1*Math.sin(a*Math.PI/180);
        const x2 = cx+r2*Math.cos(a*Math.PI/180), y2 = cy-r2*Math.sin(a*Math.PI/180);
        return <line key={s} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#0a1730" strokeWidth="2"/>;
      })}
      {/* Score moved ~1 inch (≈100 SVG units) below previous position (y=150 → y=270).
          Now sits cleanly below the arc base line with the small "OUT OF 100" label above it. */}
      <text x={cx} y="218" textAnchor="middle" fontSize="9" fill="#5a7d9d"
            letterSpacing="0.3em" fontWeight="700" fontFamily="JetBrains Mono">OUT OF 100</text>
      <text x={cx} y="300" textAnchor="middle" fontSize="76" fontWeight="900"
            fill={zoneColor} filter="url(#bigGlow)"
            style={{letterSpacing:'-0.05em',fontFamily:'Inter, sans-serif'}}>{score}</text>
      <circle cx={mx} cy={my} r="18" fill={zoneColor} opacity="0.4" filter="url(#markerGlow)"/>
      <circle cx={mx} cy={my} r="10" fill={zoneColor} stroke="#fff" strokeWidth="3"/>
      <circle cx={mx} cy={my} r="3.5" fill="#fff"/>
      {zoneLbls.map((lbl,i)=>{
        const a=s2a(lbl.s), lr=r+22;
        const lx=cx+lr*Math.cos(a*Math.PI/180), ly=cy-lr*Math.sin(a*Math.PI/180);
        const isActive = (score>=lbl.s-10 && score<=lbl.s+10);
        return <text key={i} x={lx.toFixed(1)} y={ly.toFixed(1)} textAnchor="middle"
                fontSize={isActive?"11":"10"} fill={isActive?zoneColor:"#5a7d9d"}
                fontWeight="800" letterSpacing="0.14em" fontFamily="JetBrains Mono">{lbl.t}</text>;
      })}
    </svg>
  );
}

  return (

        {drivers.drivers.map((dr, i) => (
          <div key={i} className="d-row">

// ─── Newsletter signup form ───────────────────────────────────────────────
function NewsletterForm() {
  const [name, setName]   = useState('');
  const [email, setEmail] = useState('');
  const [busy, setBusy]   = useState(false);
  const [msg, setMsg]     = useState(null); // {kind: 'ok'|'err', text: string}

  const submit = async (e) => {
    e.preventDefault();
    if (busy) return;
    setBusy(true);
    setMsg(null);
    try {
      const params = new URLSearchParams(window.location.search);
      const r = await fetch('/api/subscribe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name, email,
          source:       'dashboard',
          page_url:     window.location.href,
          referrer:     document.referrer || '',
          utm_source:   params.get('utm_source')   || '',
          utm_medium:   params.get('utm_medium')   || '',
          utm_campaign: params.get('utm_campaign') || '',
          utm_content:  params.get('utm_content')  || '',
        }),
      });
      const data = await r.json();
      if (data.ok) {
        setMsg({kind:'ok', text: data.message || "You're in! Check inbox Friday."});
        setName(''); setEmail('');
      } else {
        setMsg({kind:'err', text: data.error || 'Could not subscribe.'});
      }
    } catch (err) {
      // Network fallback: open mailto
      window.location.href = `mailto:zeroloan000@gmail.com?subject=Subscribe%20${encodeURIComponent(name)}&body=Email:%20${encodeURIComponent(email)}`;
      setMsg({kind:'err', text: 'Network blocked — opening email instead.'});
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="news-form" onSubmit={submit}>
      <div className="row">
        <input type="text" placeholder="First name" value={name} onChange={e=>setName(e.target.value)} required maxLength={120}/>
        <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} required maxLength={200}/>
      </div>
      <button type="submit" className="btn-sub" data-cta="dashboard-newsletter" disabled={busy}>
        {busy ? 'Subscribing…' : 'Subscribe Free →'}
      </button>
      {msg && <div className={`news-msg ${msg.kind}`}>◉ {msg.text}</div>}
      {!msg && <div className="news-msg" style={{color:'var(--muted-2)'}}>◉ No spam. Unsubscribe anytime.</div>}
    </form>
  );
}

// Error boundary — never let a render exception blank the page
class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err, info){ console.error('Dashboard error:', err, info); }
  render(){
    if (this.state.err) return (
      <div className="loading">
        <div style={{color:'#ef4444',fontSize:18}}>⚠️ Dashboard Error</div>
        <div style={{color:'#4a6888',fontSize:13,marginTop:8,maxWidth:520,textAlign:'center',fontFamily:'JetBrains Mono'}}>
          {String(this.state.err && this.state.err.message || this.state.err)}
        </div>
        <button onClick={()=>window.location.reload()} style={{marginTop:20,padding:'10px 24px',borderRadius:8,background:'#1a6eb5',color:'#fff',border:'none',cursor:'pointer'}}>Reload</button>
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);

<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Student Loans Index">
  <defs>
    <linearGradient id="tile" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1466B0"/>
      <stop offset="0.5" stop-color="#2E86DE"/>
      <stop offset="1" stop-color="#56A6F0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="20" y1="62" x2="70" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#tile)"/>
  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#sheen)"/>
  <rect x="3.75" y="3.75" width="88.5" height="88.5" rx="21.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2"/>

  <g fill="#ffffff" opacity="0.16">
    <rect x="22" y="58" width="8" height="16" rx="3"/>
    <rect x="36" y="50" width="8" height="24" rx="3"/>
    <rect x="50" y="42" width="8" height="32" rx="3"/>
    <rect x="64" y="32" width="8" height="42" rx="3"/>
  </g>

  <line x1="19" y1="75.5" x2="77" y2="75.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2" stroke-linecap="round"/>

  <polyline points="20,62 33,53 42,57 54,40 68,29" fill="none" stroke="#BFE0FF" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <polyline points="20,62 33,53 42,57 54,40 68,29" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="68" cy="29" r="7.5" fill="#FBBF24" opacity="0.28" filter="url(#soft)"/>
  <circle cx="68" cy="29" r="4" fill="#FBBF24"/>
  <circle cx="68" cy="29" r="4" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1"/>
</svg>

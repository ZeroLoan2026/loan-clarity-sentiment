<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tax Optimizer · The hacks your loan servicer won't tell you — Loan Clarity</title>
<meta name="description" content="Free tax optimization calculator for student loan borrowers. Find $2,400–$8,000/yr you're leaving on the table. Built for Gen Z and millennials."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#050b16; --panel:#07111f; --card:#0b1626; --card-2:#0f1d33;
    --border:#16294a; --border-2:#1e3a5f;
    --text:#e6eef7; --muted:#6f88a5; --muted-2:#4a6888;
    --accent:#2d7dd2; --accent-2:#6fb6ff;
    --hot:#ff5577; --hot-2:#ff8a3d;
    --neon:#00e5a8; --electric:#5b8cff;
    --grad-hot:linear-gradient(135deg,#ff5577 0%,#ff8a3d 100%);
    --grad-money:linear-gradient(135deg,#00e5a8 0%,#5b8cff 100%);
    --grad-cool:linear-gradient(135deg,#5b8cff 0%,#00e5a8 100%);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:64px;min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* Nav (matches platform) */
  .nav{background:rgba(7,17,31,.92);border-bottom:1px solid var(--border);
       padding:14px 28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
       position:fixed;top:0;left:0;right:0;z-index:100;
       backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .nav-left{display:flex;align-items:center;gap:12px;justify-self:start}
  .logo-mark{width:34px;height:34px;background:linear-gradient(135deg,#1a6eb5,#2d7dd2);border-radius:8px;
             display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 14px rgba(45,125,210,.25)}
  .nav-title{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .nav-sub{font-size:10px;color:#5a7d9d;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
  .nav-right{display:flex;gap:32px;justify-self:center}
  .nav-right a{color:#6f88a5;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 0;border-bottom:2px solid transparent;transition:all .15s}
  .nav-right a:hover{color:#6fb6ff}
  .nav-right a.active{color:#fff;border-bottom-color:var(--accent)}
  .nav-right a.tax-active{color:var(--neon);border-bottom-color:var(--neon)}
  .nav-spacer{justify-self:end}

  /* Hero */
  .hero{padding:60px 32px 40px;text-align:center;
        background:
          radial-gradient(ellipse at top, rgba(0,229,168,.12) 0%, transparent 50%),
          radial-gradient(ellipse at bottom, rgba(91,140,255,.08) 0%, transparent 50%)}
  .hero-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
             background:rgba(0,229,168,.12);border:1px solid rgba(0,229,168,.35);
             font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--neon);text-transform:uppercase;margin-bottom:18px}
  .hero-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .hero h1{font-size:54px;font-weight:900;letter-spacing:-.04em;line-height:1.05;color:#fff;max-width:920px;margin:0 auto}
  .hero h1 .grad{background:var(--grad-money);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero h1 .hot{background:var(--grad-hot);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:17px;color:#a8becc;max-width:680px;margin:18px auto 0;line-height:1.55}
  .hero p b{color:#fff}

  /* Stat strip */
  .stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;max-width:980px;margin:36px auto 0;
              border:1px solid var(--border-2);border-radius:14px;overflow:hidden;background:var(--panel)}
  .stat-strip .col{padding:22px 24px;text-align:center;border-right:1px solid var(--border)}
  .stat-strip .col:last-child{border-right:none}
  .stat-strip .num{font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:1;font-family:var(--mono)}
  .stat-strip .num.n{color:var(--neon)} .stat-strip .num.h{color:var(--hot)} .stat-strip .num.e{color:var(--electric)}
  .stat-strip .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:700;margin-top:8px}

  /* Calculator section */
  .calc-section{padding:60px 32px;max-width:1200px;margin:0 auto}
  .calc-eyebrow{text-align:center;font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--neon);text-transform:uppercase;margin-bottom:8px}
  .calc-h{text-align:center;font-size:38px;font-weight:900;letter-spacing:-.03em;color:#fff;margin-bottom:8px}
  .calc-sub{text-align:center;font-size:15px;color:var(--muted);max-width:620px;margin:0 auto 36px}

  .calc-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:24px}
  .calc-form{background:linear-gradient(180deg,#0b1626 0%,#07111f 100%);border:1px solid var(--border-2);border-radius:16px;padding:28px 30px}
  .calc-form h3{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.01em;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .calc-form .step-num{width:24px;height:24px;border-radius:50%;background:var(--grad-money);color:#07111f;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .calc-form .step-desc{font-size:12px;color:var(--muted);margin-bottom:16px;margin-left:34px}
  .calc-form .step{padding:22px 0;border-bottom:1px solid var(--border)}
  .calc-form .step:last-child{border-bottom:none;padding-bottom:0}
  .calc-form .step:first-child{padding-top:0}

  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
  .field input,.field select{
    width:100%;background:rgba(7,17,31,.85);border:1px solid var(--border-2);border-radius:8px;
    padding:11px 14px;color:#fff;font-size:14px;font-family:inherit;font-weight:600;
    outline:none;transition:border-color .15s
  }
  .field input:focus,.field select:focus{border-color:var(--neon)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field .prefix{position:relative}
  .field .prefix::before{content:'$';position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:14px;pointer-events:none}
  .field .prefix input{padding-left:26px}

  .field .help{font-size:11px;color:var(--muted-2);margin-top:4px;font-style:italic}

  /* Results panel */
  .results{background:
      radial-gradient(ellipse at top right,rgba(0,229,168,.15) 0%,transparent 50%),
      radial-gradient(ellipse at bottom left,rgba(255,85,119,.1) 0%,transparent 50%),
      linear-gradient(180deg,#0e1f3d 0%,#0a1530 100%);
      border:2px solid rgba(0,229,168,.35);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:18px;
      box-shadow:0 16px 50px rgba(0,229,168,.1)}
  .res-eyebrow{font-size:11px;color:var(--neon);font-weight:800;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .res-headline{font-size:18px;color:#fff;font-weight:700;letter-spacing:-.01em;line-height:1.35}
  .res-bignum-wrap{text-align:center;padding:24px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
  .res-bignum-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:700;margin-bottom:6px}
  .res-bignum{font-size:84px;font-weight:900;letter-spacing:-.05em;line-height:1;font-family:var(--mono);
              background:var(--grad-money);-webkit-background-clip:text;background-clip:text;color:transparent}
  .res-bignum-sub{font-size:13px;color:var(--muted);margin-top:8px;font-family:var(--mono)}
  .res-breakdown{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .res-row{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;background:rgba(7,17,31,.5);border:1px solid var(--border);border-radius:8px;transition:all .15s}
  .res-row:hover{border-color:var(--neon)}
  .res-row.empty{opacity:.4}
  .res-row .l{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .res-row .l .name{font-size:13px;font-weight:700;color:#fff}
  .res-row .l .desc{font-size:11px;color:var(--muted);line-height:1.4}
  .res-row .v{font-family:var(--mono);font-size:18px;font-weight:800;color:var(--neon);white-space:nowrap;margin-left:14px}
  .res-row.empty .v{color:var(--muted-2)}

  .res-cta-wrap{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:800;font-size:14px;letter-spacing:.02em;text-decoration:none;transition:transform .15s,box-shadow .15s,filter .15s;cursor:pointer;border:none;white-space:nowrap}
  .cta:hover{transform:translateY(-2px)}
  .cta-primary{background:var(--grad-money);color:#07111f;box-shadow:0 8px 24px rgba(0,229,168,.3);flex:1}
  .cta-primary:hover{filter:brightness(1.08)}
  .cta-hot{background:var(--grad-hot);color:#fff;box-shadow:0 8px 24px rgba(255,85,119,.35)}
  .cta-ghost{background:rgba(91,140,255,.08);color:#cfe1ff;border:1px solid rgba(91,140,255,.35)}
  .cta-ghost:hover{background:rgba(91,140,255,.15);border-color:var(--electric)}

  /* Strategy deep-dive cards */
  .strategy-section{padding:40px 32px 60px;max-width:1200px;margin:0 auto}
  .strat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .strat-card{background:linear-gradient(180deg,var(--card) 0%,var(--panel) 100%);border:1px solid var(--border);border-radius:14px;padding:24px 26px;transition:all .2s;cursor:default}
  .strat-card:hover{border-color:var(--electric);transform:translateY(-2px)}
  .strat-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
  .strat-icon{width:44px;height:44px;border-radius:10px;background:rgba(0,229,168,.1);border:1px solid rgba(0,229,168,.3);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .strat-icon.hot{background:rgba(255,85,119,.1);border-color:rgba(255,85,119,.3)}
  .strat-icon.electric{background:rgba(91,140,255,.1);border-color:rgba(91,140,255,.3)}
  .strat-title{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.01em}
  .strat-savings{font-size:12px;color:var(--neon);font-weight:700;margin-top:3px;font-family:var(--mono)}
  .strat-savings.hot{color:var(--hot)} .strat-savings.electric{color:var(--electric)}
  .strat-body{font-size:13.5px;color:#c0d8f0;line-height:1.6}
  .strat-body b{color:#fff}
  .strat-foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .strat-tag{font-size:10px;color:var(--muted-2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}
  .strat-link{font-size:12px;color:var(--electric);font-weight:700}

  /* CTA refi section */
  .cta-section{margin:30px 32px;border-radius:16px;
               background:
                 radial-gradient(ellipse at top right,rgba(0,229,168,.18) 0%,transparent 60%),
                 radial-gradient(ellipse at bottom left,rgba(91,140,255,.15) 0%,transparent 60%),
                 linear-gradient(180deg,#0e1f3d 0%,#0a1530 100%);
               border:2px solid rgba(0,229,168,.4);padding:36px 40px;
               display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:center;position:relative;overflow:hidden}
  .cta-badge{position:absolute;top:-12px;left:32px;padding:6px 14px;border-radius:999px;background:var(--grad-money);color:#07111f;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 4px 16px rgba(0,229,168,.4)}
  .cta-h{font-size:30px;font-weight:900;letter-spacing:-.025em;line-height:1.1;color:#fff}
  .cta-h .grad{background:var(--grad-money);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cta-p{font-size:14px;color:#a8becc;margin-top:12px;line-height:1.55}
  .cta-p b{color:#fff}
  .cta-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .cta-stats{background:rgba(7,17,31,.7);border:1px solid var(--border-2);border-radius:12px;padding:22px}
  .cta-stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
  .cta-stat:last-child{border-bottom:none}
  .cta-stat .lbl{font-size:12px;color:var(--muted)}
  .cta-stat .val{font-family:var(--mono);font-size:18px;font-weight:800;color:var(--neon)}

  /* Education strip */
  .edu-strip{padding:30px 32px;background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .edu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1100px;margin:0 auto}
  .edu-card{display:flex;flex-direction:column;gap:6px}
  .edu-icon{font-size:24px}
  .edu-title{font-size:14px;font-weight:800;color:#fff}
  .edu-desc{font-size:12px;color:var(--muted);line-height:1.4}

  /* Footer */
  .footer{padding:48px 32px 60px;background:var(--panel);border-top:1px solid var(--border);text-align:center}
  .footer-h{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.02em;margin-bottom:10px}
  .footer-p{font-size:13px;color:var(--muted);margin-bottom:20px}
  .footer-links{display:flex;gap:24px;justify-content:center;font-size:11px;color:var(--muted-2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-top:24px;padding-top:24px;border-top:1px solid var(--border);flex-wrap:wrap}
  .footer-links a{color:var(--muted-2);transition:color .15s}
  .footer-links a:hover{color:var(--neon)}

  /* Disclaimer */
  .disclaimer{padding:20px 32px;background:rgba(255,138,61,.05);border-top:1px solid rgba(255,138,61,.2);font-size:11px;color:var(--muted);text-align:center;max-width:900px;margin:0 auto;line-height:1.6}
  .disclaimer b{color:var(--hot-2)}

  /* Tiny refi CTA (replaces the giant one) */
  .mini-refi{padding:32px;max-width:1100px;margin:0 auto}
  .mini-refi-inner{
    background:
      radial-gradient(ellipse at top right,rgba(0,229,168,.12) 0%,transparent 60%),
      linear-gradient(180deg,#0e1f3d 0%,#0a1530 100%);
    border:1px solid rgba(0,229,168,.4);border-radius:14px;padding:24px 28px;
    display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
  .mini-refi-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.18em;color:var(--hot);text-transform:uppercase}
  .mini-refi-h{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1.15;margin-top:5px}
  .mini-refi-grad{background:var(--grad-money);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mini-refi-btns{display:flex;gap:8px;flex-wrap:wrap}

  /* Tiny footer */
  .mini-footer-wrap{padding:24px 32px 32px;background:var(--panel);border-top:1px solid var(--border)}
  .mini-disc{max-width:1100px;margin:0 auto 16px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6}
  .mini-disc b{color:var(--hot-2)}
  .mini-footer-row{max-width:1100px;margin:0 auto;padding-top:14px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    font-size:11px;color:var(--muted-2);font-family:var(--mono)}
  .mini-footer-links{display:flex;gap:18px}
  .mini-footer-links a{font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);transition:color .15s}
  .mini-footer-links a:hover{color:var(--neon)}
  @media(max-width:760px){
    .mini-refi{padding:16px 14px}
    .mini-refi-inner{padding:20px;flex-direction:column;text-align:center;align-items:stretch}
    .mini-refi-h{font-size:18px}
    .mini-refi-btns{justify-content:center}
    .mini-refi-btns .cta{flex:1}
    .mini-footer-wrap{padding:18px 14px 24px}
    .mini-footer-row{flex-direction:column;text-align:center}
  }

  /* Sticky mobile bottom */
  .mobile-sticky{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;padding:10px 12px;background:rgba(7,17,31,.96);border-top:1px solid var(--border-2);backdrop-filter:blur(10px);box-shadow:0 -8px 24px rgba(0,0,0,.5)}
  .mobile-sticky .cta{width:100%;padding:14px;font-size:14px}

  @media(max-width:900px){
    .hero h1{font-size:38px}
    .hero p{font-size:15px}
    .stat-strip{grid-template-columns:1fr;border-radius:10px}
    .stat-strip .col{border-right:none;border-bottom:1px solid var(--border)}
    .stat-strip .col:last-child{border-bottom:none}
    .calc-grid{grid-template-columns:1fr}
    .strat-grid{grid-template-columns:1fr}
    .cta-section{grid-template-columns:1fr;padding:28px 24px;margin:20px 14px}
    .edu-grid{grid-template-columns:1fr 1fr}
    .res-bignum{font-size:60px}
    .calc-h{font-size:26px}
  }
  @media(max-width:760px){
    html,body{padding-top:110px;padding-bottom:70px}
    .nav{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;row-gap:8px;padding:10px 14px}
    .nav-left{grid-row:1;grid-column:1}
    .nav-spacer{grid-row:1;grid-column:3}
    .nav-right{grid-row:2;grid-column:1/-1;display:flex;gap:0;padding-top:8px;border-top:1px solid var(--border);width:100%}
    .nav-right a{flex:1 1 0;text-align:center;font-size:10.5px;letter-spacing:.06em;padding:4px 2px;white-space:nowrap}
    .nav-sub{display:none}
    .nav-title{font-size:15px}
    .logo-mark{width:30px;height:30px;font-size:14px}
    .hero{padding:36px 18px 28px}
    .hero h1{font-size:30px}
    .calc-section,.strategy-section{padding:32px 16px}
    .calc-form,.results{padding:22px 18px}
    .field-row{grid-template-columns:1fr}
    .mobile-sticky{display:block}
  }
  @media(max-width:420px){
    .nav-right a{font-size:9.5px;letter-spacing:.04em;padding:4px 2px}
    .nav-emoji{display:none}
  }
</style>

<script type="text/babel">
const { useState, useMemo } = React;

/* ════════════ CALCULATION ENGINE ═══════════════════════════════════════════ */

/* All limits and brackets verified against irs.gov for 2026 tax year.
   Sources:
   - Rev. Proc. 2025-32 (2026 inflation adjustments, irs.gov/pub/irs-drop/rp-25-32.pdf)
   - IRS Notice 2025-67 (2026 retirement plan limits)
   - IRS Publication 970 (Tax Benefits for Education) — student loan interest
   - IRC §221 — Student Loan Interest Deduction
   - IRC §223 — Health Savings Accounts
   - IRC §127 — Educational Assistance Programs (loan repayment provision
     extended through 12/31/2025; 2026 status pending Congressional action) */

// 2026 federal tax brackets — single & married filing jointly (irs.gov)
const BRACKETS = {
  single:  [[12150,.10],[49400,.12],[105400,.22],[201000,.24],[255200,.32],[638000,.35],[Infinity,.37]],
  married: [[24300,.10],[98800,.12],[210800,.22],[402000,.24],[510500,.32],[766000,.35],[Infinity,.37]],
};

// IDR formula = % of discretionary income (income above 225% of poverty line)
// Note: SAVE plan permanently enjoined by 8th Circuit (2025). Borrowers transitioned
// to IBR or Standard. PAYE closed to new enrollees. IBR (10%) is the primary
// remaining income-driven option for new borrowers.
const IDR_RATE = { SAVE: 0.05, PAYE: 0.10, IBR: 0.10, ICR: 0.20, Standard: 0 };

function getBracket(income, status) {
  const brackets = BRACKETS[status === 'married' ? 'married' : 'single'];
  for (const [cap, rate] of brackets) {
    if (income < cap) return rate;
  }
  return 0.37;
}

function calculate(inputs) {
  const income      = Number(inputs.income) || 0;
  const loanBalance = Number(inputs.loanBalance) || 0;
  const interestPd  = Number(inputs.interestPaid) || 0;
  const contrib401k = Number(inputs.contrib401k) || 0;
  const status      = inputs.filingStatus || 'single';
  const plan        = inputs.plan || 'Standard';
  const employerAid = Number(inputs.employerAid) || 0;

  const marginal = getBracket(income, status);
  const idrRate  = IDR_RATE[plan] || 0;

  /* 1. Student Loan Interest Deduction — IRC §221
     Max $2,500 deductible above-the-line (statutory, unchanged).
     2026 MAGI phaseouts (irs.gov Pub 970):
     Single:  $87,000 → $102,000   |   MFJ: $175,000 → $205,000 */
  const phaseStart = status === 'married' ? 175000 : 87000;
  const phaseEnd   = status === 'married' ? 205000 : 102000;
  let interestDeductible = Math.min(interestPd, 2500);
  if (income > phaseStart) {
    const pct = Math.max(0, 1 - (income - phaseStart) / (phaseEnd - phaseStart));
    interestDeductible *= pct;
  }
  const interestSavings = Math.round(interestDeductible * marginal);

  /* 2. 401(k) — IRC §402(g) — reduces AGI: tax savings + IDR payment reduction
     2026 employee deferral limit: $24,000 (IRS Notice 2025-67) */
  const max401k = 24000;
  const cur401k = Math.min(contrib401k, max401k);
  const room401k = max401k - cur401k;
  const taxSav401k = Math.round(room401k * marginal);
  const idrSav401k = Math.round(room401k * idrRate);

  /* 3. HSA — IRC §223 — triple tax advantage (Rev. Proc. 2025-19)
     2026 contribution limits: Self $4,400 · Family $8,750 */
  const hsaMax = status === 'married' ? 8750 : 4400;
  const hsaTaxSav = Math.round(hsaMax * (marginal + 0.0765)); // income tax + FICA (7.65%)
  const hsaIdrSav = Math.round(hsaMax * idrRate);

  /* 4. Traditional IRA — IRC §219 — 2026 limit: $7,000 (under 50) */
  const iraMax = 7000;
  const iraSav = Math.round(iraMax * marginal);
  const iraIdr = Math.round(iraMax * idrRate);

  /* 5. Married Filing Separately for IDR (rough estimate) */
  // Crude approx: if married & on IDR, MFS could shield ~$30K of spouse income from payment calc
  // Net IDR savings ≈ $30K * idrRate, minus ~$2K in lost tax breaks
  const mfsSavings = (status === 'married' && idrRate > 0)
    ? Math.max(0, Math.round(30000 * idrRate - 2000))
    : 0;

  /* 6. Employer student loan assistance — up to $5,250 tax-free */
  const employerCap = Math.min(employerAid, 5250);
  const employerSav = Math.round(employerCap * marginal);

  /* 7. Refi savings (rough estimate) — if balance > $25K, assume 1.5% rate reduction */
  const refiAnnualSavings = loanBalance > 25000
    ? Math.round(loanBalance * 0.015)
    : 0;

  const total =
    interestSavings + taxSav401k + idrSav401k +
    hsaTaxSav + hsaIdrSav + iraSav + iraIdr +
    mfsSavings + employerSav + refiAnnualSavings;

  return {
    marginal:        Math.round(marginal * 100),
    idrRate:         Math.round(idrRate * 100),
    interestSavings,
    taxSav401k, idrSav401k, room401k,
    hsaTaxSav, hsaIdrSav, hsaMax,
    iraSav, iraIdr,
    mfsSavings,
    employerSav,
    refiAnnualSavings,
    total,
  };
}
